# Keeps Band's Copilot SDK patch set (consumed by thenvoi/tjam) current with upstream.
# See FORK-CHANGES.md for the patch contract and upgrade procedure.
name: jam-rebase-rustls-transport

on:
  schedule:
    - cron: "13 7 * * 1" # weekly, Monday 07:13 UTC; Band's freshness check runs at 07:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/github/copilot-sdk.git
          git fetch upstream main --quiet

      - name: Plan replay
        id: plan
        run: |
          set -euo pipefail
          target=$(git rev-parse upstream/main)
          branch=jam-rustls-transport-latest
          patches=$(git rev-list --reverse HEAD --not --remotes=upstream)
          [ -n "$patches" ] || {
            echo "no fork-only commits found on $(git branch --show-current)" >&2
            exit 1
          }
          # The replay cherry-picks one commit at a time, so every fork-only
          # commit must have exactly one parent. A merge (or an unrelated root)
          # is not a patch; refuse it before building a candidate.
          nonlinear=$(git rev-list --parents HEAD --not --remotes=upstream | awk 'NF != 2 { print $1 }')
          if [ -n "$nonlinear" ]; then
            while IFS= read -r sha; do
              echo "::error::fork-only commit $sha does not have exactly one parent; rewrite $(git branch --show-current) as a linear history over upstream (see FORK-CHANGES.md)"
            done <<< "$nonlinear"
            exit 1
          fi
          git fetch origin "$branch" --quiet || true
          {
            echo "target=$target"
            echo "branch=$branch"
            echo "patches<<EOF"
            echo "$patches"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Replay patch onto upstream main
        id: replay
        env:
          PATCHES: ${{ steps.plan.outputs.patches }}
        run: |
          set -euo pipefail
          git config user.name "jam-fork-bot"
          git config user.email "dev@thenvoi.com"
          git checkout -B "${{ steps.plan.outputs.branch }}" "${{ steps.plan.outputs.target }}"
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if ! git cherry-pick "$sha"; then
              echo "::error::$sha no longer applies to upstream main at ${{ steps.plan.outputs.target }}; resolve the fork rebase by hand"
              exit 1
            fi
          done <<< "$PATCHES"
          changed=true
          if git show-ref --verify --quiet "refs/remotes/origin/${{ steps.plan.outputs.branch }}" &&
             git diff --quiet "origin/${{ steps.plan.outputs.branch }}" HEAD; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Prepare verified CLI release inputs
        if: steps.replay.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export BUNDLED_CLI_CACHE_DIR="$RUNNER_TEMP/copilot-cli-assets"
          echo "BUNDLED_CLI_CACHE_DIR=$BUNDLED_CLI_CACHE_DIR" >> "$GITHUB_ENV"
          version=$(node -p 'require("./nodejs/package.json").copilotCliVersion')
          [[ "$version" =~ ^[0-9][a-zA-Z0-9.+-]*$ ]] || {
            echo "::error::invalid pinned Copilot CLI version"
            exit 1
          }
          release=$(gh api "repos/github/copilot-cli/releases/tags/v$version")
          asset_id() {
            jq -er --arg name "$1" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("release asset missing or duplicated: " + $name) end' \
              <<< "$release"
          }
          checksums="$RUNNER_TEMP/copilot-cli-SHA256SUMS.txt"
          gh api -H 'Accept: application/octet-stream' \
            "repos/github/copilot-cli/releases/assets/$(asset_id SHA256SUMS.txt)" > "$checksums"
          bash rust/scripts/snapshot-bundled-cli-version.sh --checksums "$checksums"
          bash rust/scripts/snapshot-bundled-in-process-version.sh --checksums "$checksums"
          mkdir -p "$BUNDLED_CLI_CACHE_DIR"
          # This job runs on Ubuntu x86_64. The SDK verifies both cached hashes.
          for asset in copilot-linux-x64.tar.gz "github-copilot-$version-linux-x64.tgz"; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/github/copilot-cli/releases/assets/$(asset_id "$asset")" \
              > "$BUNDLED_CLI_CACHE_DIR/v$version-$asset"
          done

      - name: Validate patched SDK
        if: steps.replay.outputs.changed == 'true'
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --all-targets --features test-support
          # Band compiles the SDK with default features off and installs its
          # own rustls crypto provider at runtime.
          cargo check --no-default-features --features runtime,rustls-no-provider
          cargo check --no-default-features --features network-forwarding
          OPENSSL_NO_VENDOR=1 OPENSSL_STATIC=0 cargo check --no-default-features --features native-tls
          cargo test --lib --features test-support
          cargo test --features test-support --test build_acquisition --test build_download
          cargo test --features test-support --test session_test client_stop
          # The patch exists to keep native-tls/OpenSSL out of consumers'
          # runtime and build graphs on every supported platform.
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
          )
          check_graph() {
            local target=$1 forbidden=$2 label=$3
            shift 3
            local graph
            graph=$(cargo tree -e normal,build --target "$target" "$@" \
              --prefix none --format '{p}')
            if grep -E "^($forbidden) " <<< "$graph"; then
              echo "::error::the $label consumer graph for $target selects a forbidden TLS backend"
              exit 1
            fi
          }
          for target in "${targets[@]}"; do
            check_graph "$target" 'native-tls|openssl-sys' default
            check_graph "$target" 'native-tls|openssl-sys' rustls \
              --no-default-features --features rustls
            check_graph "$target" 'aws-lc-rs|aws-lc-sys|native-tls|openssl-sys' provider-neutral \
              --no-default-features --features runtime,rustls-no-provider
          done

      - name: Push pre-staged revision
        if: steps.replay.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin "HEAD:${{ steps.plan.outputs.branch }}"
          {
            echo "## jam-rebase-rustls-transport"
            echo "Pre-staged \`${{ steps.plan.outputs.branch }}\` at $(git rev-parse HEAD)"
            echo "over upstream ${{ steps.plan.outputs.target }}."
            echo ""
            echo "Band's fork-freshness workflow (thenvoi/tjam) will file an issue if"
            echo "its pinned revision differs from this branch head."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report current revision
        if: steps.replay.outputs.changed == 'false'
        run: |
          {
            echo "## jam-rebase-rustls-transport"
            echo "The generated branch already has the expected upstream tree and fork patch set."
          } >> "$GITHUB_STEP_SUMMARY"
